services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: menumind
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: menumind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menumind"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://menumind:dev@db:5432/menumind
      GEMINI_API_KEY: ${GEMINI_API_KEY:-your_gemini_key_here}
      FAL_API_KEY: ${FAL_API_KEY:-}
      DEBUG: "true"
      # Local dev runs in a container, so backend/.env (which has this) is not
      # loaded — disable upload rate limiting here too.
      RATE_LIMIT_ENABLED: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/storage:/app/storage
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

volumes:
  postgres_data:
