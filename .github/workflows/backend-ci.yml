name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: menumind
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: menumind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        working-directory: ./backend
        run: ruff check .

      - name: Mypy type check
        working-directory: ./backend
        run: mypy app

      - name: Pytest
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://menumind:dev@localhost:5432/menumind_test
          TEST_DATABASE_URL: postgresql+asyncpg://menumind:dev@localhost:5432/menumind_test
          GEMINI_API_KEY: test_key
        run: pytest --cov=app --cov-report=term-missing
