# Codemagic CI — builds, signs and ships the iOS app to TestFlight / App Store
# from the cloud, so no Mac is needed locally.
#
# ── One-time setup in the Codemagic web UI (https://codemagic.io) ────────────
#   1. Add this repository (GitHub) as an application.
#   2. Team / Integrations → App Store Connect: create an API key in App Store
#      Connect (Users and Access → Integrations → App Store Connect API →
#      generate a key with "App Manager" role), download the .p8, and add it to
#      Codemagic. Name the integration EXACTLY:  CodemagicASCKey
#      (or rename it below to match).
#   3. In App Store Connect, create the app with bundle id  com.menumind.mobile
#      (Codemagic can also register the bundle id + provisioning automatically
#      via the API key — automatic signing below handles the profiles).
#   4. Push to the branch, then hit "Start new build" → workflow "ios-release".
#
# The build number auto-increments per Codemagic build, so every TestFlight
# upload is unique without manual bumps.
# ─────────────────────────────────────────────────────────────────────────────

workflows:
  ios-release:
    name: iOS release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    # The Flutter app lives in the mobile/ subdirectory of this repo.
    working_directory: mobile

    integrations:
      app_store_connect: CodemagicASCKey

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods dependencies
        script: find . -name "Podfile" -execdir pod install \;

      # Manual signing: fetch OR create the App Store distribution certificate
      # and provisioning profile (the automatic ios_signing block didn't create
      # them on a fresh account — --create forces creation). Credentials come
      # from the CodemagicASCKey integration above.
      - name: Set up keychain
        script: keychain initialize

      # Creating a distribution certificate needs a private key (for the CSR).
      # On a fresh account there is none, so generate one here and hand it to
      # fetch-signing-files via --certificate-key.
      - name: Generate a private key for the distribution certificate
        script: openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/dist_cert_key.pem

      - name: Fetch or create signing files
        script: |
          app-store-connect fetch-signing-files "com.menumind.mobile" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/dist_cert_key.pem \
            --create

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Apply provisioning profiles to the Xcode project
        script: xcode-project use-profiles

      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true            # ships each build to TestFlight
        # To auto-submit to App Store review once TestFlight is verified, add:
        # submit_to_app_store: false
